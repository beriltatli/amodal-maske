name: Validate project
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU inference environment
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-inference.txt
          python -m pip check
      - name: Run actual inference on an official example
        run: python scripts/demo.py --example 4 --device cpu --output results/ci
      - name: Validate sources, notebook, checkpoint and generated predictions
        run: |
          python scripts/validate_project.py
          python scripts/verify_results.py results/ci --expected-examples 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcnet-m-inference
          path: results/ci/
